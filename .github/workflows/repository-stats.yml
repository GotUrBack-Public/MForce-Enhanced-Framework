name: Update repository statistics badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-stats
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracked files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Count tracked files, directories and code lines
        run: python3 scripts/repository_stats.py --output-dir "$RUNNER_TEMP/mforce-repo-stats"
      - name: Publish Shields endpoint JSON to repo-stats branch
        uses: actions/github-script@v7
        env:
          BADGE_DIR: ${{ runner.temp }}/mforce-repo-stats
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const ref = 'heads/repo-stats';
            let current;
            try {
              current = (await github.rest.git.getRef({owner, repo, ref})).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/' + ref, sha: context.sha
              });
              current = context.sha;
            }
            const oldCommit = (await github.rest.git.getCommit({
              owner, repo, commit_sha: current
            })).data;
            const names = ['code-lines.json', 'files.json', 'directories.json'];
            const tree = (await github.rest.git.createTree({
              owner, repo, base_tree: oldCommit.tree.sha,
              tree: names.map(name => ({
                path: name, mode: '100644', type: 'blob',
                content: fs.readFileSync(path.join(process.env.BADGE_DIR, name), 'utf8')
              }))
            })).data;
            if (tree.sha === oldCommit.tree.sha) {
              core.info('Badge counts unchanged; no new commit required.');
              return;
            }
            const commit = (await github.rest.git.createCommit({
              owner, repo, message: 'chore: refresh repository statistic badges',
              tree: tree.sha, parents: [current]
            })).data;
            await github.rest.git.updateRef({
              owner, repo, ref, sha: commit.sha, force: false
            });
            core.info('Updated repo-stats branch: ' + commit.sha);
