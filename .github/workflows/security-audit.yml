name: Security audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck (scoped sourced-library exceptions)
        run: bash .github/scripts/check-shell.sh
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install security scanners
        run: python -m pip install bandit semgrep
      - name: Bandit
        run: bandit -r . -x ./tests,./.git -ll
      - name: Semgrep
        run: semgrep scan --config p/security-audit --error .
