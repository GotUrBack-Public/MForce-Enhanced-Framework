name: MForce CLI release archive

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y jq python3 shellcheck
      - name: Run complete regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Run ShellCheck
        run: bash .github/scripts/check-shell.sh
      - name: Validate release tag matches project version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="$(jq -r '.version' cfg/zrk391.json)"
          test "$GITHUB_REF_NAME" = "$version" || {
            printf 'Release tag %s does not match cfg version %s\\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          }
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create versioned archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="manual-${GITHUB_RUN_ID}"
          fi
          mkdir -p dist
          tar --exclude=.git --exclude=dist --exclude=security-reports \
            -czf "dist/mforce-enhanced-framework-${version}.tar.gz" .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mforce-cli-archive
          path: dist/
      - name: Publish GitHub Release on version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MForce Enhanced Framework $GITHUB_REF_NAME" \
            --generate-notes
