name: MForce CLI release archive

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq python3
      - name: Validate release version against project configuration
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          declared="$(jq -r '.version' cfg/zrk391.json)"
          if [[ "$GITHUB_REF_NAME" != "$declared" ]]; then
            printf 'Tag %s does not match configured version %s\n' "$GITHUB_REF_NAME" "$declared" >&2
            exit 1
          fi
      - name: Run complete regression suite before packaging
        run: |
          bash -n xrm742.sh install.sh
          python3 -m unittest discover -s tests -v
      - name: Create versioned archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="manual-${GITHUB_RUN_ID}"
          fi
          mkdir -p dist
          tar --exclude=.git --exclude=dist --exclude=security-reports \
            -czf "dist/mforce-enhanced-framework-${version}.tar.gz" .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mforce-cli-archive
          path: dist/
      - name: Publish GitHub Release on version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MForce Enhanced Framework $GITHUB_REF_NAME" \
            --generate-notes
