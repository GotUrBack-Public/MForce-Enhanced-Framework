name: Publish GitHub Packages container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mforce-ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verification dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Run ShellCheck
        run: bash .github/scripts/check-shell.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish MForce container package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goturback-public/mforce-enhanced-framework:latest
            ghcr.io/goturback-public/mforce-enhanced-framework:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GotUrBack-Public/MForce-Enhanced-Framework
            org.opencontainers.image.title=MForce Enhanced Framework
            org.opencontainers.image.description=Interactive MForce CLI with defensive and authorized security assessment modules
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
